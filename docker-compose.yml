services:
  backend:
    build:
      context: ./backend
    image: lost-found-backend:1.0
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/lostfound
    ports:
      - "5001:5001"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: lost-found-frontend:1.0
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:8
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:
